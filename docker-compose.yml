services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrium}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atrium}"]
      interval: 5s
      timeout: 5s
      retries: 5

  atrium:
    build:
      context: .
      dockerfile: docker/unified.Dockerfile
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:-atrium}@postgres:5432/${POSTGRES_DB:-atrium}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      WEB_URL: "${WEB_URL}"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      smtp-relay:
        condition: service_started

  smtp-relay:
    image: ghcr.io/dmitaj/microsoft-365-smtp-relay:latest
    restart: unless-stopped
    environment:
      Graph_TenantId: "${MICROSOFT_TENANT_ID}"
      Graph_ClientId: "${MICROSOFT_CLIENT_ID}"
      Graph_ClientSecret: "${MICROSOFT_CLIENT_SECRET}"
      SendFrom: "portal@sharpbladesolutions.com"
      Smtp_Host: "0.0.0.0"
      Smtp_Port: "25"
      LogLevel: "INFO"
      LogPath: "/var/log/smtp-relay"
    volumes:
      - smtp-relay-logs:/var/log/smtp-relay
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  smtp-relay-logs:
