services:
  atrium:
    build:
      context: .
      dockerfile: docker/unified.Dockerfile
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      WEB_URL: "${WEB_URL}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads:/app/uploads
    depends_on:
      smtp-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  smtp-relay:
    image: ghcr.io/dmitaj/microsoft-365-smtp-relay:latest
    restart: unless-stopped
    environment:
      Graph_TenantId: "${MICROSOFT_TENANT_ID}"
      Graph_ClientId: "${MICROSOFT_CLIENT_ID}"
      Graph_ClientSecret: "${MICROSOFT_CLIENT_SECRET}"
      SendFrom: "${SMTP_RELAY_SEND_FROM}"
      Smtp_Host: "0.0.0.0"
      Smtp_Port: "25"
      LogLevel: "INFO"
      LogPath: "/var/log/smtp-relay"
    volumes:
      - smtp-relay-logs:/var/log/smtp-relay
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  uploads:
    name: atrium-uploads
  smtp-relay-logs:
